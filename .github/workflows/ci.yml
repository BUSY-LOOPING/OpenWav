name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    name: Build · frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w frontend

  node:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mixed workspaces list their unit files explicitly; the integration job runs everything else so new files are never skipped
        include:
          - { name: Unit · shared, workspace: packages/shared }
          - { name: Unit · frontend, workspace: frontend }
          - { name: Unit · downloader, workspace: services/downloader, args: test/ytdlp.test.js }
          - { name: Integration · db migrations, workspace: packages/db }
          - { name: Integration · backend API, workspace: backend }
          - { name: Integration · downloader, workspace: services/downloader, args: --exclude test/ytdlp.test.js }
          - { name: Integration · scheduler, workspace: services/scheduler }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -w ${{ matrix.workspace }} -- --reporter=verbose ${{ matrix.args }}

  python:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Unit · scraper, service: scraper, args: tests/test_normalize.py }
          - { name: Integration · scraper API, service: scraper, args: --ignore=tests/test_normalize.py }
          - { name: Unit · recommender model, service: recommender, args: tests/test_model.py }
          - { name: Integration · recommender API, service: recommender, args: --ignore=tests/test_model.py }
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -o addopts= -v ${{ matrix.args }}
