# Studio loads assets from absolute paths, so it needs its own hostname rather than a sub-path
server {
  listen 443 ssl;
  http2 on;
  server_name ~^studio\.;

  ssl_certificate /etc/nginx/certs/tls.crt;
  ssl_certificate_key /etc/nginx/certs/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  auth_basic "OpenWav ops";
  auth_basic_user_file /etc/nginx/ops.htpasswd;

  location / {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $studio_upstream prisma-studio:5555;

    # Studio only accepts its own localhost origin; keep foreign origins so its CSRF check still rejects them
    set $studio_origin $http_origin;
    if ($http_origin = "https://$host") { set $studio_origin http://localhost:5555; }

    proxy_pass http://$studio_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin $studio_origin;
    proxy_set_header Authorization "";
    proxy_read_timeout 300s;
  }
}
