resolver 127.0.0.11 valid=30s ipv6=off;

location /grafana/ {
  set $ops_upstream grafana:3000;
  proxy_pass http://$ops_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location /rabbitmq/ {
  set $ops_upstream rabbitmq:15672;
  proxy_pass http://$ops_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

# Prometheus and Alertmanager have no login of their own
location /prometheus/ {
  auth_basic "OpenWav ops";
  auth_basic_user_file /etc/nginx/ops.htpasswd;
  set $ops_upstream prometheus:9090;
  rewrite ^/prometheus/(.*)$ /$1 break;
  proxy_pass http://$ops_upstream;
  proxy_set_header Authorization "";
}

location /alertmanager/ {
  auth_basic "OpenWav ops";
  auth_basic_user_file /etc/nginx/ops.htpasswd;
  set $ops_upstream alertmanager:9093;
  rewrite ^/alertmanager/(.*)$ /$1 break;
  proxy_pass http://$ops_upstream;
  proxy_set_header Authorization "";
}
