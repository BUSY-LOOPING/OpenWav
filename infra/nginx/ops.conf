resolver 127.0.0.11 valid=30s ipv6=off;

# Every ops tool requires an OpenWav admin session (ow_ops cookie set by the admin console)
location = /_ops_auth {
  internal;
  proxy_pass http://api/api/v1/admin/ops-check;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_pass_request_body off;
  proxy_set_header Content-Length "";
}

location @ops_login {
  return 302 /admin;
}

location /grafana/ {
  auth_request /_ops_auth;
  error_page 401 = @ops_login;
  set $ops_upstream grafana:3000;
  proxy_pass http://$ops_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location /rabbitmq/ {
  auth_request /_ops_auth;
  error_page 401 = @ops_login;
  set $ops_upstream rabbitmq:15672;
  proxy_pass http://$ops_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location /prometheus/ {
  auth_request /_ops_auth;
  error_page 401 = @ops_login;
  set $ops_upstream prometheus:9090;
  rewrite ^/prometheus/(.*)$ /$1 break;
  proxy_pass http://$ops_upstream;
}

location /alertmanager/ {
  auth_request /_ops_auth;
  error_page 401 = @ops_login;
  set $ops_upstream alertmanager:9093;
  rewrite ^/alertmanager/(.*)$ /$1 break;
  proxy_pass http://$ops_upstream;
}

# Studio requests its assets and API from the site root, so those paths are routed to it too
location /studio/ {
  auth_request /_ops_auth;
  error_page 401 = @ops_login;
  set $ops_upstream prisma-studio:5556;
  rewrite ^/studio/(.*)$ /$1 break;
  proxy_pass http://$ops_upstream;
}

location ~ ^/(studio\.js|studio\.css|bff|telemetry)$ {
  auth_request /_ops_auth;
  set $ops_upstream prisma-studio:5556;

  # Studio only accepts its own localhost origin; keep foreign origins so its CSRF check still rejects them
  set $studio_origin $http_origin;
  if ($http_origin = "https://$host") { set $studio_origin http://localhost:5555; }

  proxy_pass http://$ops_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Origin $studio_origin;
  proxy_read_timeout 300s;
}
