global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: backend
    static_configs:
      - targets: ["host.docker.internal:3000"]
  - job_name: downloader
    static_configs:
      - targets: ["host.docker.internal:9464"]
  - job_name: scheduler
    static_configs:
      - targets: ["host.docker.internal:9465"]
  - job_name: scraper
    static_configs:
      - targets: ["host.docker.internal:8100"]
  - job_name: recommender
    static_configs:
      - targets: ["host.docker.internal:8000"]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
