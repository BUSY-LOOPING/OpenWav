global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: backend
    dns_sd_configs:
      - names: ["backend"]
        type: A
        port: 3000
    metrics_path: /metrics
  - job_name: downloader
    dns_sd_configs:
      - names: ["downloader"]
        type: A
        port: 9464
  - job_name: scheduler
    static_configs:
      - targets: ["scheduler:9465"]
  - job_name: scraper
    static_configs:
      - targets: ["scraper:8100"]
  - job_name: recommender
    static_configs:
      - targets: ["recommender:8000"]
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
